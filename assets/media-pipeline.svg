<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 200" width="100%" height="auto" style="background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <linearGradient id="mediaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F141D"/>
      <stop offset="100%" stop-color="#0B0E14"/>
    </linearGradient>

    <linearGradient id="appleMusicGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FC3C44"/>
      <stop offset="100%" stop-color="#FA243C"/>
    </linearGradient>

    <linearGradient id="spotifyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1ED760"/>
      <stop offset="100%" stop-color="#1DB954"/>
    </linearGradient>

    <linearGradient id="flowRight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3478F6"/>
      <stop offset="100%" stop-color="#60A5FA"/>
    </linearGradient>

    <linearGradient id="flowLeft" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#3DDC84"/>
      <stop offset="100%" stop-color="#82AAFF"/>
    </linearGradient>

    <filter id="boxShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Container -->
  <rect width="880" height="200" rx="16" fill="url(#mediaBg)" stroke="#222F42" stroke-width="1"/>

  <!-- Left: macOS Media Controller -->
  <g transform="translate(35, 25)">
    <rect width="240" height="150" rx="12" fill="#161D29" stroke="#2B3A50" stroke-width="1" filter="url(#boxShadow)"/>
    <text x="18" y="28" fill="#FFFFFF" font-size="13" font-weight="700">macOS Media Engine</text>
    <text x="18" y="44" fill="#7E8FA6" font-size="10.5">AppleScript &amp; Image Downsampler</text>
    <line x1="18" y1="56" x2="222" y2="56" stroke="#233044" stroke-width="1"/>

    <!-- Player Badges -->
    <g transform="translate(18, 68)">
      <rect width="98" height="28" rx="6" fill="#24141A" stroke="#481F26" stroke-width="1"/>
      <circle cx="16" cy="14" r="5" fill="#FA2D48"/>
      <text x="28" y="18" fill="#FCA5A5" font-size="11" font-weight="600">Apple Music</text>
    </g>
    <g transform="translate(124, 68)">
      <rect width="98" height="28" rx="6" fill="#12261A" stroke="#1F472B" stroke-width="1"/>
      <circle cx="16" cy="14" r="5" fill="#1DB954"/>
      <text x="28" y="18" fill="#86EFAC" font-size="11" font-weight="600">Spotify</text>
    </g>

    <!-- Thumbnail generation note -->
    <rect x="18" y="106" width="204" height="26" rx="6" fill="#121722"/>
    <text x="28" y="123" fill="#94A3B8" font-size="10" font-weight="500">Artwork downsampled to 128px &lt;16KB</text>
  </g>

  <!-- Middle: Network Flows -->
  <g transform="translate(305, 45)">
    <!-- Flow 1: Metadata -> Android -->
    <path d="M 0 25 L 260 25" stroke="url(#flowRight)" stroke-width="2" stroke-dasharray="6 4"/>
    <polygon points="265,25 255,20 255,30" fill="#60A5FA"/>
    <rect x="35" y="12" width="190" height="24" rx="12" fill="#1A273D" stroke="#2C4368" stroke-width="1"/>
    <text x="130" y="28" fill="#93C5FD" font-size="10" font-weight="600" text-anchor="middle">media.state (Track, Artist, Art, Pos)</text>

    <!-- Flow 2: Remote Control -> macOS -->
    <path d="M 270 85 L 10 85" stroke="url(#flowLeft)" stroke-width="2" stroke-dasharray="6 4"/>
    <polygon points="5,85 15,80 15,90" fill="#82AAFF"/>
    <rect x="35" y="73" width="190" height="24" rx="12" fill="#15261F" stroke="#254A37" stroke-width="1"/>
    <text x="130" y="89" fill="#86EFAC" font-size="10" font-weight="600" text-anchor="middle">quick.request (Play / Pause / Seek)</text>
  </g>

  <!-- Right: Android MediaSession -->
  <g transform="translate(605, 25)">
    <rect width="240" height="150" rx="12" fill="#161D29" stroke="#2B3A50" stroke-width="1" filter="url(#boxShadow)"/>
    <text x="18" y="28" fill="#FFFFFF" font-size="13" font-weight="700">Android System Integration</text>
    <text x="18" y="44" fill="#7E8FA6" font-size="10.5">MediaSession &amp; Notification.MediaStyle</text>
    <line x1="18" y1="56" x2="222" y2="56" stroke="#233044" stroke-width="1"/>

    <!-- MediaSession outputs -->
    <g transform="translate(18, 68)">
      <rect width="204" height="30" rx="6" fill="#19271E" stroke="#2A4835" stroke-width="1"/>
      <text x="12" y="20" fill="#3DDC84" font-size="12">🔒</text>
      <text x="32" y="20" fill="#E2E8F0" font-size="11" font-weight="600">Lock-Screen Media Player</text>
    </g>
    <g transform="translate(18, 106)">
      <rect width="204" height="30" rx="6" fill="#19271E" stroke="#2A4835" stroke-width="1"/>
      <text x="12" y="20" fill="#3DDC84" font-size="12">🎛️</text>
      <text x="32" y="20" fill="#E2E8F0" font-size="11" font-weight="600">Notification Shade Controls</text>
    </g>
  </g>
</svg>

