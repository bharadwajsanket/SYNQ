<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 280" width="100%" height="auto" style="background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="50%" stop-color="#141B26"/>
      <stop offset="100%" stop-color="#0A0E14"/>
    </linearGradient>

    <radialGradient id="glowMac" cx="20%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#3478F6" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#3478F6" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowAndroid" cx="80%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#3DDC84" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#3DDC84" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="bridgeLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3478F6"/>
      <stop offset="50%" stop-color="#82AAFF"/>
      <stop offset="100%" stop-color="#3DDC84"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1F2937" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#111827" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.45"/>
    </filter>

    <filter id="softGlow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Container Box -->
  <rect width="880" height="280" rx="20" fill="url(#bgGrad)" stroke="#263345" stroke-width="1"/>
  <rect width="880" height="280" rx="20" fill="url(#glowMac)"/>
  <rect width="880" height="280" rx="20" fill="url(#glowAndroid)"/>

  <!-- Background Grid Lines (Subtle) -->
  <g opacity="0.07" stroke="#FFFFFF" stroke-width="0.8" stroke-dasharray="4 4">
    <line x1="0" y1="70" x2="880" y2="70"/>
    <line x1="0" y1="140" x2="880" y2="140"/>
    <line x1="0" y1="210" x2="880" y2="210"/>
    <line x1="220" y1="0" x2="220" y2="280"/>
    <line x1="440" y1="0" x2="440" y2="280"/>
    <line x1="660" y1="0" x2="660" y2="280"/>
  </g>

  <!-- Connection Bridge Lines -->
  <path d="M 280 135 L 600 135" stroke="url(#bridgeLine)" stroke-width="2.5" stroke-dasharray="6 4" filter="url(#softGlow)"/>
  
  <!-- Center Shield Node -->
  <g transform="translate(440, 135)">
    <circle r="36" fill="#151D2A" stroke="#3A4D6B" stroke-width="1.5" filter="url(#cardShadow)"/>
    <circle r="26" fill="#1C2738" stroke="url(#bridgeLine)" stroke-width="1.5"/>
    <!-- Lock / Shield Icon -->
    <path d="M -7 -4 L -7 -9 C -7 -13 -3 -16 0 -16 C 3 -16 7 -13 7 -9 L 7 -4 Z" fill="none" stroke="#82AAFF" stroke-width="2"/>
    <rect x="-9" y="-4" width="18" height="15" rx="3" fill="#82AAFF"/>
    <circle cx="0" cy="3" r="2" fill="#0D1117"/>
    <!-- Shield Label Badge -->
    <rect x="-65" y="44" width="130" height="20" rx="10" fill="#1A2536" stroke="#2D3F59" stroke-width="1"/>
    <text x="0" y="58" fill="#93C5FD" font-size="9.5" font-weight="700" text-anchor="middle" letter-spacing="0.08em">AES-GCM-256 E2EE</text>
  </g>

  <!-- Left: macOS Card -->
  <g transform="translate(45, 45)">
    <!-- Main Card Body -->
    <rect width="235" height="180" rx="16" fill="url(#cardGrad)" stroke="#2C3B52" stroke-width="1" filter="url(#cardShadow)"/>
    
    <!-- Header -->
    <g transform="translate(18, 20)">
      <!-- Apple Logo -->
      <svg x="0" y="2" width="20" height="20" viewBox="0 0 24 24" fill="#FFFFFF">
        <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 6.37c.62-.75 1.04-1.8 0.93-2.85-.9.04-1.98.6-2.61 1.34-.56.65-.97 1.7-.85 2.72 1 .08 2.01-.52 2.53-1.21z"/>
      </svg>
      <text x="28" y="14" fill="#FFFFFF" font-size="14" font-weight="700" letter-spacing="-0.01em">macOS Companion</text>
      <text x="28" y="29" fill="#8A99AD" font-size="11" font-weight="500">Swift &amp; Native SwiftUI</text>
    </g>

    <line x1="18" y1="64" x2="217" y2="64" stroke="#263449" stroke-width="1"/>

    <!-- Features Pill List -->
    <g transform="translate(18, 78)">
      <!-- Row 1: Apple Music & Spotify -->
      <g transform="translate(0, 0)">
        <rect width="199" height="26" rx="6" fill="#16202E" stroke="#25354C" stroke-width="1"/>
        <text x="10" y="17" fill="#FA586A" font-size="11">🎵</text>
        <text x="28" y="17" fill="#E2E8F0" font-size="11" font-weight="600">Apple Music &amp; Spotify</text>
      </g>
      <!-- Row 2: Universal Clipboard -->
      <g transform="translate(0, 32)">
        <rect width="199" height="26" rx="6" fill="#16202E" stroke="#25354C" stroke-width="1"/>
        <text x="10" y="17" fill="#60A5FA" font-size="11">📋</text>
        <text x="28" y="17" fill="#E2E8F0" font-size="11" font-weight="600">Universal Clipboard Sync</text>
      </g>
      <!-- Row 3: Menu Bar Hub -->
      <g transform="translate(0, 64)">
        <rect width="199" height="26" rx="6" fill="#16202E" stroke="#25354C" stroke-width="1"/>
        <text x="10" y="17" fill="#34D399" font-size="11">⚡</text>
        <text x="28" y="17" fill="#E2E8F0" font-size="11" font-weight="600">Line-Speed Pipelined Files</text>
      </g>
    </g>
  </g>

  <!-- Right: Android Card -->
  <g transform="translate(600, 45)">
    <!-- Main Card Body -->
    <rect width="235" height="180" rx="16" fill="url(#cardGrad)" stroke="#2C3B52" stroke-width="1" filter="url(#cardShadow)"/>
    
    <!-- Header -->
    <g transform="translate(18, 20)">
      <!-- Android Icon -->
      <svg x="0" y="2" width="20" height="20" viewBox="0 0 24 24" fill="#3DDC84">
        <path d="M17.523 15.3414c-.5511 0-.9993-.4486-.9993-.9997s.4482-.9993.9993-.9993c.551 0 .9993.4482.9993.9993.0001.5511-.4482.9997-.9993.9997m-11.046 0c-.5511 0-.9993-.4486-.9993-.9997s.4482-.9993.9993-.9993c.5511 0 .9993.4482.9993.9993 0 .5511-.4482.9997-.9993.9997m11.4045-6.02l1.9973-3.4592a.416.416 0 00-.1521-.5676.416.416 0 00-.5676.1521l-2.0223 3.503C15.5902 8.4116 13.8533 8.082 12 8.082s-3.5902.3296-5.1368.8677L4.8409 5.4467a.4161.4161 0 00-.5677-.1521.4157.4157 0 00-.1521.5676l1.9973 3.4592C2.6889 11.1867.3432 14.6589 0 18.761h24c-.3432-4.1021-2.6889-7.5743-6.1185-9.4396"/>
      </svg>
      <text x="28" y="14" fill="#FFFFFF" font-size="14" font-weight="700" letter-spacing="-0.01em">Android Companion</text>
      <text x="28" y="29" fill="#8A99AD" font-size="11" font-weight="500">Kotlin &amp; Jetpack Compose</text>
    </g>

    <line x1="18" y1="64" x2="217" y2="64" stroke="#263449" stroke-width="1"/>

    <!-- Features Pill List -->
    <g transform="translate(18, 78)">
      <!-- Row 1: Native MediaSession -->
      <g transform="translate(0, 0)">
        <rect width="199" height="26" rx="6" fill="#16202E" stroke="#25354C" stroke-width="1"/>
        <text x="10" y="17" fill="#3DDC84" font-size="11">🎛️</text>
        <text x="28" y="17" fill="#E2E8F0" font-size="11" font-weight="600">Lock-Screen MediaSession</text>
      </g>
      <!-- Row 2: Phone Calls & SMS -->
      <g transform="translate(0, 32)">
        <rect width="199" height="26" rx="6" fill="#16202E" stroke="#25354C" stroke-width="1"/>
        <text x="10" y="17" fill="#FBBF24" font-size="11">📞</text>
        <text x="28" y="17" fill="#E2E8F0" font-size="11" font-weight="600">Calls &amp; Notification Relay</text>
      </g>
      <!-- Row 3: Android-to-Android -->
      <g transform="translate(0, 64)">
        <rect width="199" height="26" rx="6" fill="#16202E" stroke="#25354C" stroke-width="1"/>
        <text x="10" y="17" fill="#A78BFA" font-size="11">🤝</text>
        <text x="28" y="17" fill="#E2E8F0" font-size="11" font-weight="600">Android-to-Android P2P</text>
      </g>
    </g>
  </g>

  <!-- Bottom Badges / Metrics -->
  <g transform="translate(0, 246)">
    <text x="140" y="14" fill="#64748B" font-size="10.5" font-weight="600" text-anchor="middle">📡 DIRECT LOCAL WI-FI</text>
    <circle cx="240" cy="11" r="2.5" fill="#334155"/>
    <text x="340" y="14" fill="#64748B" font-size="10.5" font-weight="600" text-anchor="middle">☁️ ZERO CLOUD / NO SERVERS</text>
    <circle cx="440" cy="11" r="2.5" fill="#334155"/>
    <text x="540" y="14" fill="#64748B" font-size="10.5" font-weight="600" text-anchor="middle">🛡️ HARDWARE KEYSTORE</text>
    <circle cx="640" cy="11" r="2.5" fill="#334155"/>
    <text x="740" y="14" fill="#64748B" font-size="10.5" font-weight="600" text-anchor="middle">🚀 64-CHUNK STREAMING</text>
  </g>
</svg>

